name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  # ---------------- Kotlin / Spring Boot ----------------
  kotlin:
    name: ${{ matrix.service }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false            # a failing service does not stop the others
      matrix:
        service: [gateway, inventory-orders, payments, notifications]
    defaults:
      run:
        working-directory: services/${{ matrix.service }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle
          cache-dependency-path: |
            services/${{ matrix.service }}/*.gradle.kts
            services/${{ matrix.service }}/gradle/wrapper/gradle-wrapper.properties

      - name: Build and test
        run: |
          chmod +x gradlew
          ./gradlew build --no-daemon

  # ---------------- Rust / Axum ----------------
  rust:
    name: ${{ matrix.service }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: [catalogue, ticketing]
    defaults:
      run:
        working-directory: services/${{ matrix.service }}
    env:
      SQLX_OFFLINE: "true"        # compile sqlx queries from .sqlx/, no live DB (L17, L22)
    steps:
      - uses: actions/checkout@v4

      - name: Toolchain
        run: rustup component add rustfmt clippy

      - name: Format
        run: cargo fmt --check

      - name: Lint
        run: cargo clippy --all-targets -- -D warnings

      - name: Test
        run: cargo test
