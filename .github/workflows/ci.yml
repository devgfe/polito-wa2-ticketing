name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  # ---------------- Kotlin / Spring Boot ----------------
  kotlin:
    name: ${{ matrix.service }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false            # a failing service does not stop the others
      matrix:
        service: [gateway, inventory-orders, payments, notifications]
    defaults:
      run:
        working-directory: services/${{ matrix.service }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Build and test
        run: |
          chmod +x gradlew
          ./gradlew build --no-daemon

  # ---------------- Rust / Axum ----------------
  rust:
    name: ${{ matrix.service }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: [catalogue, ticketing]
    defaults:
      run:
        working-directory: services/${{ matrix.service }}
    env:
      SQLX_OFFLINE: "true"        # compile sqlx queries from .sqlx/, no live DB (L17, L22)
    steps:
      - uses: actions/checkout@v4

      - name: Toolchain
        run: rustup component add rustfmt clippy

      - name: Format
        run: cargo fmt --check

      - name: Lint
        run: cargo clippy --all-targets -- -D warnings

      - name: Test
        run: cargo test

  # ---------------- OpenAPI: breaking changes ----------------
  openapi:
    name: openapi ${{ matrix.service }}
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: [catalogue, inventory-orders, payments, ticketing]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0               # needed to read the target branch

      - uses: actions/setup-go@v5
        with:
          go-version: stable

      - name: Install oasdiff
        run: go install github.com/oasdiff/oasdiff@latest

      - name: Compare with the target branch
        run: |
          doc="services/${{ matrix.service }}/openapi.yaml"
          if ! git show "origin/${{ github.base_ref }}:$doc" > /tmp/base.yaml 2>/dev/null; then
            echo "New document, nothing to compare"; exit 0
          fi
          ~/go/bin/oasdiff changelog /tmp/base.yaml "$doc"
          ~/go/bin/oasdiff breaking  /tmp/base.yaml "$doc" --fail-on ERR